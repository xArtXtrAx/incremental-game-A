name: Update History PR11 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-history-pr11-temp.yml

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update HISTORIAL_GPT
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/update_history.py
          python /tmp/update_history.py

      - name: Commit history and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-history-pr11-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HISTORIAL_GPT.MD .github/workflows/update-history-pr11-temp.yml
          git commit -m "Actualiza bitácora tras integrar Fase 6"
          git push origin HEAD:main
