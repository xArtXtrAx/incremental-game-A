name: Apply Developer Panel Overlap Fix Temp

on:
  push:
    branches: [Dev-Developer-Panel-Viewport]
    paths:
      - .github/workflows/apply-dev-panel-overlap-fix-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: Dev-Developer-Panel-Viewport
          fetch-depth: 0

      - name: Separate floating controller from developer panel
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/dev-panel-overlap-fix.patch
          git apply --check /tmp/dev-panel-overlap-fix.patch
          git apply /tmp/dev-panel-overlap-fix.patch

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-dev-panel-overlap-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separa control flotante del Panel DEV"
          git push origin HEAD:Dev-Developer-Panel-Viewport
