name: Apply Developer Panel Interaction Fix Temp

on:
  push:
    branches: [Dev-Developer-Panel-Viewport]
    paths:
      - .github/workflows/apply-dev-panel-interaction-fix-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: Dev-Developer-Panel-Viewport
          fetch-depth: 0

      - name: Apply interaction regression fix
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/developer-panel-gamepad-code-fix.patch
          git apply --check /tmp/developer-panel-gamepad-code-fix.patch
          git apply /tmp/developer-panel-gamepad-code-fix.patch

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-dev-panel-interaction-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige interacción entre Panel DEV y gamepad"
          git push origin HEAD:Dev-Developer-Panel-Viewport
