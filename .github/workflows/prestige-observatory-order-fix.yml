name: Apply Prestige Observatory Order Fix

on:
  push:
    branches:
      - Dev-Prestige-Cycle-Observatory
    paths:
      - .github/workflows/prestige-observatory-order-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev-Prestige-Cycle-Observatory
          fetch-depth: 0

      - name: Apply deterministic order fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/prestigeCycleObservatory.ts')
          text = engine.read_text(encoding='utf-8')
          old = """    purchaseAffordableUpgrades()
              if (crystallizeIfReady() && cycles.length >= settings.targetCycles) {
                endedBy = 'target-cycles'
              } else {
                for (
          """
          new = """    if (crystallizeIfReady() && cycles.length >= settings.targetCycles) {
                endedBy = 'target-cycles'
              } else {
                purchaseAffordableUpgrades()
                for (
          """
          if old not in text:
              raise SystemExit('Expected initial purchase/crystallization block was not found')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/unit/prestigeCycleImmediateCrystallization.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'
          import { DEFAULT_BALANCE_CONFIG } from '../../src/balanceConfig'
          import { initialGameState } from '../../src/game'
          import { runPrestigeCycleExperiment } from '../../src/prestigeCycleObservatory'

          describe('cristalización inmediata del Observatorio', () => {
            it('cristaliza antes de comprar cuando el escenario comienza con el núcleo lleno', () => {
              const candidate = {
                id: 'official',
                name: 'Balance oficial',
                config: structuredClone(DEFAULT_BALANCE_CONFIG),
              }
              const result = runPrestigeCycleExperiment({
                scenario: {
                  id: 'full-core',
                  name: 'Núcleo lleno',
                  capturedAt: 0,
                  state: {
                    ...initialGameState,
                    energy: 1_000_000,
                    manualClicks: 5_000,
                    generatorLevel: 5,
                    prestigeCount: 5,
                  },
                },
                candidateA: candidate,
                candidateB: candidate,
                settings: {
                  durationSeconds: 1,
                  manualClicksPerSecond: 0,
                  autoPurchase: true,
                  targetCycles: 1,
                },
                startedAt: 1_000,
              })

              expect(result.ok).toBe(true)
              if (!result.ok) return
              const cycle = result.value.runA.completedCycles[0]
              expect(cycle.durationSeconds).toBe(0)
              expect(cycle.purchaseCount).toBe(0)
              expect(cycle.energySpent).toBe(0)
              expect(cycle.finalUpgradeLevels.generator).toBe(5)
              expect(result.value.runA.finalState.prestigeCount).toBe(6)
              expect(result.value.runA.finalState.generatorLevel).toBe(0)
            })
          })
          """, encoding='utf-8')

          Path('.github/workflows/prestige-observatory-order-fix.yml').unlink()
          PY

      - name: Commit correction
        run: |
          git config user.name "xArtXtrAx"
          git config user.email "132019928+xArtXtrAx@users.noreply.github.com"
          git add src/prestigeCycleObservatory.ts tests/unit/prestigeCycleImmediateCrystallization.test.ts .github/workflows/prestige-observatory-order-fix.yml
          git commit -m "Cristaliza antes de comprar en escenarios completos"
          git push origin HEAD:Dev-Prestige-Cycle-Observatory
