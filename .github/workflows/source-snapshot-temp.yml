name: Apply Mathematical Template Bridges Temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply validated patch and remove temporary files
        shell: bash
        run: |
          cat .github/patch-part-0* | base64 --decode > /tmp/mathematical-template-bridges.patch
          git apply --check /tmp/mathematical-template-bridges.patch
          git apply /tmp/mathematical-template-bridges.patch
          rm .github/patch-part-0*
          rm .github/workflows/source-snapshot-temp.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Conecta plantillas con Laboratorio y Comparador"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
