name: Source Snapshot Dev Panel Temp

on:
  push:
    branches: [Dev-Developer-Panel-Viewport]
    paths:
      - .github/workflows/source-snapshot-dev-panel-temp.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Upload editable sources
        uses: actions/upload-artifact@v4
        with:
          name: developer-panel-source-temp
          path: |
            src
            tests
            package.json
            playwright.config.ts
          retention-days: 1
