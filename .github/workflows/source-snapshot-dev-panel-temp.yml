name: Apply Developer Panel Workspace Temp

on:
  push:
    branches: [Dev-Developer-Panel-Viewport]
    paths:
      - .github/workflows/source-snapshot-dev-panel-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: Dev-Developer-Panel-Viewport
          fetch-depth: 0

      - name: Apply reviewed workspace patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/developer-panel-workspace.patch
          git apply --check /tmp/developer-panel-workspace.patch
          git apply /tmp/developer-panel-workspace.patch

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/source-snapshot-dev-panel-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Acopla Panel DEV al alto del juego"
          git push origin HEAD:Dev-Developer-Panel-Viewport
